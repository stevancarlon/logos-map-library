[workspace]
members = ["testimonial", "registry", "registry-sdk", "wallet-core", "wallet-store", "maps", "nft-core", "map-registry", "map-sdk", "wallet-lez", "wallet-bridge"]
resolver = "2"
exclude = ["lez-v03"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spel-framework = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
