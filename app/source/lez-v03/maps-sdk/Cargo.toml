[package]
name = "logos-maps-v03-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
logos-maps-v03-core = { path = "../maps-core" }
logos-map-registry = { path = "../../map-registry" }
lee-v03 = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee-core-v03 = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
spel-framework = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c" }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
ureq = { version = "3", features = ["json"] }
thiserror = "2"
base64 = "0.22"
hex = "0.4"
logos-map-distribution = { path = "../../maps", default-features = false, optional = true }

[features]
default = ["distribution"]
distribution = ["dep:logos-map-distribution"]

[[bin]]
name = "maps-v03"
path = "src/bin/maps-v03.rs"
required-features = ["distribution"]

[dev-dependencies]
anyhow = "1"
program-loader-v03 = { package = "program_loader_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-binfmt = "=3.0.5"
risc0-zkos-v1compat = "=2.2.2"
