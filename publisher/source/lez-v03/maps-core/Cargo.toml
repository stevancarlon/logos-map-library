[package]
name = "logos-maps-v03-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
logos-map-registry = { path = "../../map-registry" }
spel-framework = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c" }
lee-core-v03 = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
thiserror = "2"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
risc0-binfmt = "=3.0.5"
risc0-zkos-v1compat = "=2.2.2"
